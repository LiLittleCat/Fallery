name: Build and checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Build development app
        run: dotnet build Fallery.csproj -c Release -p:Platform=x64
      - name: Core checks
        run: dotnet run --project Tests/CoreChecks/CoreChecks.csproj -- .
      - name: Update checks
        run: dotnet run --project Tests/UpdateChecks/UpdateChecks.csproj
      - name: Language checks
        run: dotnet run --project Tests/LanguageChecks/LanguageChecks.csproj -- .
